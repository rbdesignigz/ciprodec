<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CIPRODEC · Servicios interactivos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--dark:#141618;--dark2:#262e37;--dark3:#313b46;--light:#f4f1ea;--acc:#e5322d;--acc2:#b8231f;--muted:#aeb6bf;--ink:#141618}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--dark);color:var(--light);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--dark)}
.brand{font-weight:800;letter-spacing:1px;font-size:21px;white-space:nowrap;cursor:pointer}
.brand span{color:var(--acc)}
.brand small{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.5px;color:var(--muted);font-weight:500;margin-top:5px}
nav{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
nav::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;background:var(--dark2);color:var(--light);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;background:#222a33;overflow:hidden;touch-action:none}
#side{flex:none;width:380px;display:flex;flex-direction:column;gap:12px;padding:14px;overflow-y:auto;background:var(--dark)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:none}
#svgwrap{position:absolute;inset:0;display:none;padding:10px}
#svgwrap svg{width:100%;height:100%;display:block;overflow:hidden}
#home{position:absolute;inset:0;overflow-y:auto;display:none;padding:28px 32px 40px;touch-action:pan-y}
.panel{background:var(--light);color:var(--ink);border-radius:18px;padding:18px 20px}
.panel h2{margin:0 0 6px;font-size:23px;line-height:1.15}
.panel .tag{display:inline-block;background:var(--acc);color:#fff;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:800;border-radius:8px;padding:4px 10px;font-size:15px;margin:4px 6px 6px 0}
.panel p{margin:6px 0 0;font-size:16px;line-height:1.45;color:#3c444d}
.panel ul{margin:8px 0 0;padding-left:20px;font-size:15px;line-height:1.45;color:#3c444d}
.panel .note{font-size:13px;color:#6b737c;margin-top:10px}
.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl h4{margin:4px 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;background:var(--dark3);color:var(--light);cursor:pointer}
.btn.big{background:var(--acc);color:#fff;font-size:17px;padding:14px 18px}
.btn.on{outline:2px solid var(--acc);background:#3a4552}
.chip{display:flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:9px 12px;background:var(--dark2);color:var(--light);font-size:14px;font-weight:600;cursor:pointer}
.chip i{width:16px;height:16px;border-radius:5px;flex:none;border:1px solid #0003}
.chip.off{opacity:.35}
.chip.on{outline:2px solid var(--acc)}
.slider{display:flex;flex-direction:column;gap:6px;background:var(--dark2);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.slider input{width:100%;accent-color:#e5322d}
.slider b{color:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--dark2);border-radius:12px;padding:10px 12px}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
.stat b{font-size:26px}
.stat.ok b{color:#7fd39a}.stat.bad b{color:#ff7a6b}
.hero h1{margin:0;font-size:40px;line-height:1.1}
.hero p{margin:10px 0 0;color:var(--muted);font-size:18px;max-width:760px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:24px}
.tile{border:0;text-align:left;background:var(--dark2);color:var(--light);border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--acc);min-height:150px}
.tile em{font-style:normal;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--acc);letter-spacing:1px}
.sedes{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.sedes span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;border:1px solid #3a4047;border-radius:8px;padding:7px 12px;color:var(--light)}
#home{background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}
.tile .ic{font-size:30px;line-height:1}
.tile b{font-size:18px}
.tile span{font-size:14px;color:var(--muted);line-height:1.35}
.homefoot{display:flex;align-items:center;gap:20px;margin-top:28px;background:var(--dark2);border-radius:18px;padding:16px 20px}
.homefoot .qr{width:130px;height:130px;background:#fff;border-radius:12px;padding:6px;flex:none}
.homefoot .qr svg{width:100%;height:100%;display:block}
.homefoot p{margin:0;font-size:16px;color:var(--muted);line-height:1.5}
.homefoot p b{color:var(--light);font-size:19px}
/* svg interactivity */
[data-k]{cursor:pointer}
.sel{filter:drop-shadow(0 0 5px #e5322d) drop-shadow(0 0 2px #e5322d)}
.dimmed{opacity:.18;transition:opacity .3s}
.flow{stroke-dasharray:10 12;animation:flow 1s linear infinite}
.flow.slow{animation-duration:2s}
.flow.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-22}}
.blink{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.wa{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:16px;padding:12px;border-top:5px solid var(--acc);text-decoration:none;margin-top:auto}
.wa .q{width:112px;height:112px;flex:none}.wa .q svg{width:100%;height:100%;display:block}
.wa b{display:block;font-size:18px}.wa small{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:#b8231f;font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.wa .lg{height:16px;margin-top:6px;filter:invert(1)}
.homewa{display:flex;align-items:center;gap:24px;margin-top:20px;background:#fff;color:var(--ink);border-radius:18px;padding:18px 22px;border-left:6px solid var(--acc);text-decoration:none}
.homewa .q{width:170px;height:170px;flex:none}.homewa .q svg{width:100%;height:100%;display:block}
.homewa small{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;color:#b8231f;font-weight:600;letter-spacing:1px}
.homewa b{display:block;font-size:30px;margin:6px 0}
.homewa .lg{height:30px;filter:invert(1);display:block;margin-bottom:10px}
@media (max-width:900px){.homewa b{font-size:22px}.homewa .q{width:140px;height:140px}.wa .q{width:130px;height:130px}main.home #stage{flex:1;height:auto}}
@media (max-width:480px){.homewa{flex-direction:column;align-items:flex-start}}
.hidden{display:none}
svg.off .flow{animation-play-state:paused;opacity:.12}
svg.off .blink{animation:none;opacity:.2}
.nightsky{opacity:0;transition:opacity .6s;pointer-events:none}
svg.night .nightsky{opacity:.6}
svg.night .sun{opacity:0;transition:opacity .6s}
svg.night .dayflow{animation-play-state:paused;opacity:.1}
svg.night .ttl{fill:#f4f1ea}
@media (max-width:900px){
  main{flex-direction:column}
  #side{width:auto;flex:1;padding:10px}
  #stage{flex:none;height:56vh}
  header{flex-wrap:wrap;padding:8px 10px;gap:8px}
  nav{order:3;flex-basis:100%}
  .tab{padding:8px 12px;font-size:14px}
  .hero h1{font-size:28px}
  #home{padding:18px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tile{min-height:120px;padding:14px}
  .tile b{font-size:16px}
}
</style>
</head>

function selectKey(k){
  var svg=svgwrap.querySelector("svg");if(!svg)return;
  svg.querySelectorAll(".sel").forEach(function(n){n.classList.remove("sel");});
  selKey=k;
  if(k){svg.querySelectorAll("[data-k=\""+k+"\"]").forEach(function(n){n.classList.add("sel");});showInfo(cur.info[k],true);}

}

/* ---------- 3D engine ---------- */
var T3=(function(){

    grid(f,[x0,y0,z0],[dx,0,0],[0,0,dz],[0,-1,0]);grid(f,[x0,y1,z0],[dx,0,0],[0,0,dz],[0,1,0]);

    var c0=[],c1=[];for(var k2=0;k2<seg;k2++){c0.push(ring(0,k2));c1.push(ring(1,k2));}f.push({p:c0,n:mul(d,-1)});f.push({p:c1,n:d});return f;}
  function pipe(f,pts,r){for(var i=0;i<pts.length-1;i++)cyl(f,pts[i],pts[i+1],r,10);return f;}
  function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}

  var ctx=cv.getContext("2d"),W=0,H=0,sc=null,cam={},hidden={},selected=null,explodeF=0,spin=true,drawn=[],need=true,active=false,spinBtn=null;
  var LIGHT=norm([0.45,0.85,0.3]);

  window.addEventListener("resize",function(){if(active)resize();});
  function effT(){var t=cam.target.slice();if(sc.explode)t[1]+=explodeF;return t;}
  function camPos(){var cp=Math.cos(cam.pitch),d=cam.dist*(sc.explode?1+0.5*explodeF:1);return add(effT(),[d*cp*Math.sin(cam.yaw),d*Math.sin(cam.pitch),d*cp*Math.cos(cam.yaw)]);}
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function render(){

    var list=[];
    sc.items.forEach(function(it){
      if(!it.ghost&&hidden[it.layer])return;
      var oy=(sc.explode&&it.ey)?it.ey*explodeF:0,dim=selected&&selected!==it&&!it.ghost,col=selected===it?[255,150,60]:it.rgb;
      for(var i=0;i<it.faces.length;i++){var fc=it.faces[i],c0=[0,0,0],pts=[],ok=true,zs=0;

    for(var j=0;j<list.length;j++){var e=list[j],p=e.pts;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(var m=1;m<p.length;m++)ctx.lineTo(p[m][0],p[m][1]);ctx.closePath();
      var cs="rgba("+e.rgb[0]+","+e.rgb[1]+","+e.rgb[2]+","+e.a+")";ctx.fillStyle=cs;ctx.fill();if(e.a>0.5){ctx.strokeStyle=cs;ctx.lineWidth=0.8;ctx.stroke();}}
    if(sc.labels){ctx.font="600 13px system-ui,Arial";ctx.textBaseline="middle";ctx.textAlign="center";
      sc.items.forEach(function(it){if(it.ghost||hidden[it.layer]||!it.anchor)return;if(selected?selected!==it:!it.lbl)return;
        var s=proj(it.anchor);if(s[2]<0.2)return;var t=it.tags[0],w=ctx.measureText(t).width+14;
        ctx.fillStyle="rgba(28,34,41,0.85)";rr(s[0]-w/2,s[1]-26,w,22,11);ctx.fill();ctx.fillStyle="#f4f1ea";ctx.fillText(t,s[0],s[1]-15);});}
  }
  function pick(x,y){for(var i=drawn.length-1;i>=0;i--){var e=drawn[i];if(e.it.ghost)continue;var p=e.pts,ins=false;
