<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel de administración – CIPRODEC</title>
<link rel="icon" href="./img/iso-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap">
<link rel="stylesheet" href="./src/ciprodec.css">
<style>
body{background:var(--soft)}
.abar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.abar .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap}
.abar .brand svg{height:24px}
.abar .who{margin-left:auto;font-size:.88rem;color:var(--muted);text-align:right;line-height:1.3}
.abar .who b{color:var(--ink)}
.tabs-a{display:flex;gap:6px;flex-wrap:wrap;padding:16px 0}
.tabs-a button{font:700 .92rem var(--sans);min-height:42px;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.tabs-a button[aria-selected="true"]{background:var(--ink);color:#fff}
.hoja{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:22px;margin-bottom:40px}
.hoja-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hoja-h p{color:var(--muted);font-size:.92rem;margin-top:4px;max-width:70ch}
.fila{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fila .th{width:64px;height:48px;border-radius:8px;background:#EEE;object-fit:cover;display:block}
.fila .t{font-weight:700;overflow-wrap:anywhere}
.fila .s{font-size:.85rem;color:var(--muted)}
.fila .oculto{font:700 .75rem var(--mono);color:#8A1414;background:#FDECEC;border-radius:6px;padding:2px 6px;margin-left:6px}
.fila .acc{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mini{font:700 .85rem var(--sans);min-height:38px;min-width:38px;padding:6px 10px;border-radius:8px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.mini.rojo{border-color:#B91C1C;color:#B91C1C}
.mini:disabled{opacity:.35;cursor:default}
@media (max-width:640px){.fila{grid-template-columns:52px minmax(0,1fr)}.fila .th{width:52px;height:40px}.fila .acc{grid-column:1/-1;justify-content:flex-start}}
dialog.ed{border:2px solid var(--ink);border-radius:16px;padding:0;width:min(760px,96vw);max-height:92vh}
dialog.ed::backdrop{background:rgba(0,0,0,.5)}
.ed-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.ed-b{padding:18px 20px;display:grid;gap:14px}
.ed-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.campo .ayuda{font-size:.82rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:22px;height:22px}
.fotos-ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.fotos-ed .f{position:relative;border-radius:8px;overflow:hidden;background:#EEE;border:2px solid transparent}
.fotos-ed .f:first-child{border-color:var(--red)}
.fotos-ed img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.fotos-ed .f .ops{position:absolute;inset:auto 4px 4px 4px;display:flex;gap:4px;justify-content:space-between}
.fotos-ed .f .ops button{font:700 .75rem var(--sans);border:0;border-radius:6px;padding:4px 7px;background:rgba(255,255,255,.92);cursor:pointer}
.sub{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;background:#FCFCFB}
.sub-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:100;max-width:92vw;display:none}
.toast.show{display:block}
.toast.err{background:#B91C1C}
</style>
</head>
<body>
<div class="abar"><div class="wrap">
  <a class="brand" href="./index.html" aria-label="Ver el sitio">
    <svg aria-hidden="true" viewBox="0 0 1208 148"><g fill="none" stroke="#1A1A1A" stroke-linecap="round" stroke-width="28"><path d="M59.48 15.78A60 60 0 0 0 59.48 132.22 M88.52 15.78A60 60 0 0 1 124.88 42.20 M124.88 105.80A60 60 0 0 1 88.52 132.22"/></g><g transform="translate(0 24.00)" fill="none" stroke="#1A1A1A" stroke-width="20" stroke-linejoin="round"><path d="M304.0 30.0A20 20 0 0 0 284.0 10.0H218.0A20 20 0 0 0 198.0 30.0V70.0A20 20 0 0 0 218.0 90.0H284.0A20 20 0 0 0 304.0 70.0 M346.0 0V100 M388.0 100V10.0H464.0A20 20 0 0 1 484.0 30.0V36A20 20 0 0 1 464.0 56H388.0 M526.0 100V10.0H606.0A20 20 0 0 1 626.0 30.0V36A20 20 0 0 1 606.0 56H526.0M606.0 56A20 20 0 0 1 626.0 76V100 M688.0 10.0H762.0A20 20 0 0 1 782.0 30.0V70.0A20 20 0 0 1 762.0 90.0H688.0A20 20 0 0 1 668.0 70.0V30.0A20 20 0 0 1 688.0 10.0Z M824.0 10.0H910.0A20 20 0 0 1 930.0 30.0V70.0A20 20 0 0 1 910.0 90.0H824.0Z M1058.0 10.0H972.0V90.0H1058.0M972.0 56H1044.0 M1196.0 30.0A20 20 0 0 0 1176.0 10.0H1110.0A20 20 0 0 0 1090.0 30.0V70.0A20 20 0 0 0 1110.0 90.0H1176.0A20 20 0 0 0 1196.0 70.0"/></g></svg>
  </a>
  <span class="mono" style="font-size:.9rem">Panel</span>
  <div class="who" id="who"></div>
  <button type="button" class="mini" id="btnSalir" hidden>Salir</button>
</div></div>

<main class="wrap">
  <div id="sinAcceso" class="hoja" style="margin-top:24px" hidden></div>
  <div id="app" hidden>
    <div class="tabs-a" role="tablist" id="tabs"></div>
    <section class="hoja" id="hoja" aria-live="polite"></section>
  </div>
</main>

<dialog class="ed" id="ed" aria-labelledby="edTitulo">
  <form method="dialog" id="edForm" novalidate>
    <div class="ed-h"><h2 id="edTitulo" style="font-size:1.25rem"></h2><button type="button" class="mini" id="edCerrar" aria-label="Cerrar">✕</button></div>
    <div class="ed-b" id="edCuerpo"></div>
    <div class="ed-f"><span id="edMsg" style="margin-right:auto;font-size:.9rem;align-self:center"></span><button type="button" class="btn" id="edCancelar">Cancelar</button><button type="submit" class="btn red" id="edGuardar">Guardar</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="./src/config.js"></script>
<script type="module">
import * as D from './src/datos.js';
const $ = id => document.getElementById(id), esc = D.esc;
let PERFIL = null, TAB = null, ITEMS = [];

function toast(t, err) { const el = $('toast'); el.textContent = t; el.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => el.className = 'toast', err ? 6000 : 2600); }
const hoy = () => new Date().toISOString().slice(0, 10);

/* ================= Definición de cada sección ================= */
const SEC = {
  noticias: {
    col: 'noticias', titulo: 'Noticias', nuevoArriba: true,
    ayuda: 'Se publican en la portada (las 3 primeras) y en la página Noticias. Siempre citá la fuente y escribí el análisis con tus palabras; no copies el texto de la nota.',
    th: x => x.imagen, sub: x => [x.categoria, D.fechaTxt(x.fecha), x.fuente && 'Fuente: ' + x.fuente].filter(Boolean).join(' · '),
    campos: [
      { k: 'titulo', l: 'Título', req: true },
      { k: 'categoria', l: 'Categoría', ayuda: 'Ej.: Sector construcción, Inversión y negocios, Normativa' },
      { k: 'fecha', l: 'Fecha', t: 'date', def: hoy },
      { k: 'imagen', l: 'Imagen de portada', t: 'foto', ayuda: 'Usá una imagen propia (no la foto del diario).' },
      { k: 'alt', l: 'Descripción de la imagen (para accesibilidad)' },
      { k: 'contenido', l: 'Resumen de la noticia', t: 'area', req: true, ayuda: 'Con tus palabras. Separá los párrafos con una línea en blanco. **texto** = negrita.' },
      { k: 'analisis', l: 'Análisis CIPRODEC', t: 'area' },
      { k: 'fuente', l: 'Fuente (medio)', ayuda: 'Ej.: Última Hora, ABC Color, INDEC' },
      { k: 'fuenteUrl', l: 'Enlace a la nota original', t: 'url' },
      { k: 'fuenteFecha', l: 'Fecha de la nota original', t: 'date' },
      { k: 'visible', l: 'Publicada (visible en la web)', t: 'check', def: true }
    ]
  },
  obras: {
    col: 'obras', titulo: 'Obras y proyectos',
    ayuda: 'Portfolio público de la portada. No pongas nombres de clientes ni direcciones exactas.',
    th: x => (x.fotos || [])[0], sub: x => [x.area, x.ubicacion, x.estado].filter(Boolean).join(' · '),
    campos: [
      { k: 'titulo', l: 'Título', req: true },
      { k: 'area', l: 'Área', ayuda: 'Ej.: Ingeniería · Cálculo estructural' },
      { k: 'ubicacion', l: 'Ubicación (ciudad)' },
      { k: 'estado', l: 'Estado / año', ayuda: 'Ej.: Proyecto 2026, Obra terminada 2025' },
      { k: 'descripcion', l: 'Descripción', t: 'area' },
      { k: 'datos', l: 'Datos destacados (uno por línea)', t: 'lineas' },
      { k: 'fotos', l: 'Fotos (la primera es la portada)', t: 'fotos' },
      { k: 'enlace', l: 'Enlace opcional', t: 'url', ayuda: 'Ej.: un modelo 3D o un video' },
      { k: 'enlaceTexto', l: 'Texto del botón del enlace', ayuda: 'Ej.: Ver modelo 3D' },
      { k: 'nota', l: 'Nota al pie', ayuda: 'Ej.: Imágenes: renders del proyecto.' },
      { k: 'visible', l: 'Visible en la web', t: 'check', def: true }
    ]
  },
  precios: {
    col: 'ediciones', titulo: 'Revista de precios', nuevoArriba: true,
    ayuda: 'Cada mes, una edición nueva arriba de todo. Solo números publicados por la fuente, con su enlace. Las fuentes por país se editan abajo.',
    th: () => '', sub: x => (x.indicadores || []).length + ' indicadores · ' + D.fechaTxt(x.fecha),
    tituloItem: x => 'Edición ' + (x.titulo || ''),
    campos: [
      { k: 'titulo', l: 'Título de la edición', req: true, ayuda: 'Ej.: Diciembre 2026' },
      { k: 'titulo_pt', l: 'Título en portugués', ayuda: 'Ej.: Dezembro 2026' },
      { k: 'fecha', l: 'Fecha', t: 'date', def: hoy },
      { k: 'indicadores', l: 'Indicadores del mes', t: 'objetos', item: 'Indicador', campos: [
        { k: 'pais', l: 'País', t: 'select', op: [['PY', 'Paraguay'], ['AR', 'Argentina'], ['BR', 'Brasil']] },
        { k: 'nombre', l: 'Nombre', req: true }, { k: 'valor', l: 'Valor', req: true, ayuda: 'Ej.: +1,5 % mensual' },
        { k: 'detalle', l: 'Detalle', t: 'area' }, { k: 'fuente', l: 'Fuente', req: true },
        { k: 'fuenteUrl', l: 'Enlace de la fuente', t: 'url' }, { k: 'fuenteFecha', l: 'Fecha de la fuente', t: 'date' }] },
      { k: 'analisis', l: 'Análisis CIPRODEC (un párrafo por bloque, separados por línea en blanco)', t: 'parrafos' },
      { k: 'visible', l: 'Publicada', t: 'check', def: true }
    ],
    extra: 'fuentes'
  },
  fuentes: {
    col: 'fuentes', titulo: 'Fuentes de precios por país',
    th: () => '', sub: x => [x.pais, x.frecuencia].filter(Boolean).join(' · '),
    tituloItem: x => x.nombre,
    campos: [
      { k: 'pais', l: 'País', t: 'select', op: [['PY', 'Paraguay'], ['AR', 'Argentina'], ['BR', 'Brasil']] },
      { k: 'nombre', l: 'Nombre', req: true }, { k: 'cubre', l: 'Qué cubre (uno por línea)', t: 'lineas', ayuda: 'Ej.: Mano de obra / Materiales / Índice' },
      { k: 'frecuencia', l: 'Frecuencia' }, { k: 'descripcion', l: 'Descripción', t: 'area' },
      { k: 'url', l: 'Enlace', t: 'url' }, { k: 'urlTexto', l: 'Texto del enlace' }
    ]
  },
  propiedades: {
    col: 'propiedades', titulo: 'Inmobiliaria',
    ayuda: 'Propiedades de la página Inmobiliaria. El WhatsApp de consultas se cambia en Ajustes.',
    th: x => (x.fotos || [])[0], sub: x => [x.condicion, x.precio, x.ubicacion].filter(Boolean).join(' · '),
    campos: [
      { k: 'titulo', l: 'Título', req: true },
      { k: 'condicion', l: 'Condición', t: 'select', op: [['Venta', 'Venta'], ['Alquiler', 'Alquiler'], ['Vendida', 'Vendida'], ['Alquilada', 'Alquilada']] },
      { k: 'precio', l: 'Precio', ayuda: 'Ej.: USD 116.600 · Gs. 4.500.000/mes' },
      { k: 'ubicacion', l: 'Ubicación' },
      { k: 'mapa', l: 'Enlace a Google Maps', t: 'url' },
      { k: 'terreno', l: 'Terreno', ayuda: 'Ej.: 600 m²' }, { k: 'construido', l: 'Superficie construida' },
      { k: 'habitaciones', l: 'Dormitorios' }, { k: 'banos', l: 'Baños' },
      { k: 'fotos', l: 'Fotos (la primera es la portada)', t: 'fotos' },
      { k: 'visible', l: 'Publicada', t: 'check', def: true }
    ]
  },
  clientes: {
    col: 'obrasClientes', titulo: 'Obras de clientes',
    ayuda: 'Área privada: cada cliente ve solo las obras donde figura su email, en "Ingresar" de la web. Recordá autorizar su email en Usuarios con el nivel Cliente.',
    th: () => '', sub: x => [(x.clientes || []).join(', '), typeof x.avance === 'number' ? x.avance + '%' : ''].filter(Boolean).join(' · '),
    campos: [
      { k: 'titulo', l: 'Nombre de la obra', req: true },
      { k: 'clientes', l: 'Emails de los clientes con acceso (uno por línea)', t: 'emails', req: true },
      { k: 'ubicacion', l: 'Ubicación' }, { k: 'estado', l: 'Estado', ayuda: 'Ej.: En ejecución, Proyecto, Terminada' },
      { k: 'avance', l: 'Avance general (%)', t: 'num' },
      { k: 'descripcion', l: 'Descripción', t: 'area' },
      { k: 'documentos', l: 'Documentos (enlaces a Drive, PDF, etc.)', t: 'objetos', item: 'Documento', campos: [
        { k: 'nombre', l: 'Nombre', req: true }, { k: 'url', l: 'Enlace', t: 'url', req: true }] },
      { k: 'avances', l: 'Avances de obra', t: 'objetos', item: 'Avance', campos: [
        { k: 'fecha', l: 'Fecha', t: 'date', def: hoy }, { k: 'titulo', l: 'Título', req: true },
        { k: 'porcentaje', l: 'Avance (%)', t: 'num' }, { k: 'texto', l: 'Detalle', t: 'area' },
        { k: 'fotos', l: 'Fotos', t: 'fotos', privada: true }] }
    ]
  },
  usuarios: {
    col: 'usuarios', titulo: 'Usuarios', idDesde: 'email',
    ayuda: 'Alta, baja y modificación de accesos. La persona ingresa con Google o con email y contraseña desde "Ingresar"; solo entra si su email está acá y activo.',
    th: () => '', sub: x => (D.ROLES[x.rol] || x.rol) + (x.activo === false ? ' · inactivo' : ''),
    tituloItem: x => (x.nombre ? x.nombre + ' – ' : '') + x.id,
    campos: [
      { k: 'email', l: 'Email', t: 'email', req: true, soloAlta: true },
      { k: 'nombre', l: 'Nombre' },
      { k: 'rol', l: 'Nivel de acceso', t: 'select', op: [['cliente', 'Cliente – ve solo sus obras'], ['inmobiliaria', 'Inmobiliaria – propiedades'], ['editor', 'Empleado – noticias, obras, precios y obras de clientes'], ['admin', 'Administrador – todo, incluido usuarios']] },
      { k: 'activo', l: 'Acceso activo', t: 'check', def: true },
      { k: 'notas', l: 'Notas internas', t: 'area' }
    ]
  },
  ajustes: { titulo: 'Ajustes' }
};
const TABS = [['noticias', 'Noticias'], ['obras', 'Obras'], ['precios', 'Precios'], ['propiedades', 'Inmobiliaria'], ['clientes', 'Obras de clientes'], ['usuarios', 'Usuarios'], ['ajustes', 'Ajustes']];

/* ================= Listado ================= */
async function abrirTab(t) {
  TAB = t;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t)));
  try { localStorage.setItem('ciprodec-admin-tab', t); } catch (e) { }
  if (t === 'ajustes') return pintarAjustes();
  const S = SEC[t];
  $('hoja').innerHTML = '<p class="vacio">Cargando…</p>';
  try { ITEMS = await D.listar(S.col); } catch (e) { $('hoja').innerHTML = '<div class="aviso err">' + esc(D.mensajeError(e)) + '</div>'; return; }
  let html = cabecera(S, t) + await filas(S, ITEMS, t);
  if (S.extra) {
    const E = SEC[S.extra]; const ex = await D.listar(E.col).catch(() => []);
    SEC[S.extra]._items = ex;
    html += '<div style="margin-top:34px">' + cabecera(E, S.extra) + await filas(E, ex, S.extra) + '</div>';
  }
  $('hoja').innerHTML = html;
}
function cabecera(S, t) {
  return '<div class="hoja-h"><div><h2 style="font-size:1.5rem">' + esc(S.titulo) + '</h2>' + (S.ayuda ? '<p>' + esc(S.ayuda) + '</p>' : '') + '</div>' +
    '<button type="button" class="btn red" data-acc="nuevo" data-t="' + t + '">+ Agregar</button></div>' +
    (t === 'noticias' && D.modo === 'firebase' && PERFIL.rol === 'admin' && !ITEMS.length ? '<div class="aviso info" style="margin-bottom:12px">La base está vacía. <button type="button" class="mini" data-acc="importar">Importar el contenido actual de la web</button> (noticias, obras, precios y propiedades que hoy están en la carpeta data/).</div>' : '');
}
async function filas(S, items, t) {
  if (!items.length) return '<p class="vacio">Todavía no hay nada cargado.</p>';
  const ths = await Promise.all(items.map(x => S.th ? D.fotoUrl(S.th(x)).catch(() => '') : ''));
  return items.map((x, i) => '<div class="fila">' +
    (ths[i] ? '<img class="th" src="' + esc(ths[i]) + '" alt="">' : '<div class="th"></div>') +
    '<div><div class="t">' + esc(S.tituloItem ? S.tituloItem(x) : x.titulo) + (x.visible === false ? '<span class="oculto">OCULTO</span>' : '') + '</div><div class="s">' + esc(S.sub(x)) + '</div></div>' +
    '<div class="acc">' +
    (t !== 'usuarios' ? '<button type="button" class="mini" data-acc="subir" data-t="' + t + '" data-i="' + i + '" aria-label="Subir" ' + (i === 0 ? 'disabled' : '') + '>↑</button><button type="button" class="mini" data-acc="bajar" data-t="' + t + '" data-i="' + i + '" aria-label="Bajar" ' + (i === items.length - 1 ? 'disabled' : '') + '>↓</button>' : '') +
    ('visible' in x || S.campos.some(c => c.k === 'visible') ? '<button type="button" class="mini" data-acc="vis" data-t="' + t + '" data-i="' + i + '">' + (x.visible === false ? 'Mostrar' : 'Ocultar') + '</button>' : '') +
    '<button type="button" class="mini" data-acc="editar" data-t="' + t + '" data-i="' + i + '">Editar</button>' +
    '<button type="button" class="mini rojo" data-acc="borrar" data-t="' + t + '" data-i="' + i + '">Borrar</button></div></div>').join('');
}
const itemsDe = t => (t === TAB ? ITEMS : SEC[t]._items) || [];

$('hoja').addEventListener('click', async e => {
  const b = e.target.closest('button[data-acc]'); if (!b) return;
  const t = b.dataset.t, S = SEC[t], items = t ? itemsDe(t) : [], i = +b.dataset.i, x = items[i];
  try {
    if (b.dataset.acc === 'nuevo') return editar(t, null);
    if (b.dataset.acc === 'editar') return editar(t, x);
    if (b.dataset.acc === 'importar') return importar(b);
    if (b.dataset.acc === 'vis') { x.visible = x.visible === false; await D.guardar(S.col, x); toast(x.visible ? 'Visible en la web' : 'Oculto'); return abrirTab(TAB); }
    if (b.dataset.acc === 'subir' || b.dataset.acc === 'bajar') {
      const j = b.dataset.acc === 'subir' ? i - 1 : i + 1; if (j < 0 || j >= items.length) return;
      items.forEach((it, k) => { if (typeof it.orden !== 'number') it.orden = k; });
      const o = items[i].orden; items[i].orden = items[j].orden; items[j].orden = o;
      if (items[i].orden === items[j].orden) { items[i].orden = j; items[j].orden = i; }
      b.disabled = true; await Promise.all([D.guardar(S.col, items[i]), D.guardar(S.col, items[j])]); return abrirTab(TAB);
    }
    if (b.dataset.acc === 'borrar') {
      if (b.dataset.conf !== '1') { b.dataset.conf = '1'; b.textContent = '¿Seguro? Tocá de nuevo'; setTimeout(() => { b.dataset.conf = ''; b.textContent = 'Borrar'; }, 4000); return; }
      if (t === 'usuarios' && x.id === (PERFIL.email || '').toLowerCase()) { toast('No podés borrarte a vos mismo.', true); return; }
      await D.borrar(S.col, x.id); await borrarFotos(fotosDe(S, x)); toast('Borrado'); return abrirTab(TAB);
    }
  } catch (er) { toast(D.mensajeError(er), true); }
});

/* ================= Editor ================= */
let ED = null; // {t, S, original, fotosNuevas:[]}
function valorInicial(c, x) { return x && x[c.k] !== undefined ? x[c.k] : (typeof c.def === 'function' ? c.def() : c.def); }
function campoHtml(c, v, pre) {
  const id = pre + c.k, req = c.req ? ' required' : '', ay = c.ayuda ? '<div class="ayuda">' + esc(c.ayuda) + '</div>' : '';
  const lab = '<label for="' + id + '">' + esc(c.l) + (c.req ? ' *' : '') + '</label>';
  switch (c.t) {
    case 'area': return '<div class="campo">' + lab + '<textarea id="' + id + '" data-k="' + c.k + '"' + req + '>' + esc(v || '') + '</textarea>' + ay + '</div>';
    case 'parrafos': return '<div class="campo">' + lab + '<textarea id="' + id + '" data-k="' + c.k + '" style="min-height:200px">' + esc((v || []).join('\n\n')) + '</textarea>' + ay + '</div>';
    case 'lineas': case 'emails': return '<div class="campo">' + lab + '<textarea id="' + id + '" data-k="' + c.k + '"' + req + '>' + esc((v || []).join('\n')) + '</textarea>' + ay + '</div>';
    case 'check': return '<label class="check"><input type="checkbox" id="' + id + '" data-k="' + c.k + '"' + (v !== false ? ' checked' : '') + '> ' + esc(c.l) + '</label>';
    case 'select': return '<div class="campo">' + lab + '<select id="' + id + '" data-k="' + c.k + '">' + c.op.map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === v ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>' + ay + '</div>';
    case 'foto': case 'fotos': return '<div class="campo"><label>' + esc(c.l) + '</label><div class="fotos-ed" data-fotos="' + c.k + '" data-uno="' + (c.t === 'foto' ? 1 : 0) + '" data-priv="' + (c.privada ? 1 : 0) + '" data-v="' + esc(JSON.stringify(c.t === 'foto' ? (v ? [v] : []) : (v || []))) + '"></div><label class="btn" style="width:max-content;cursor:pointer">+ Subir foto' + (c.t === 'fotos' ? 's' : '') + '<input type="file" accept="image/*"' + (c.t === 'fotos' ? ' multiple' : '') + ' hidden data-subir="' + c.k + '"></label>' + ay + '</div>';
    case 'objetos': return '<div class="campo"><label>' + esc(c.l) + '</label><div data-objs="' + c.k + '" style="display:grid;gap:10px"></div><button type="button" class="mini" data-addobj="' + c.k + '" style="width:max-content">+ Agregar ' + esc(c.item.toLowerCase()) + '</button></div>';
    default: {
      const tipo = c.t === 'date' ? 'date' : c.t === 'url' ? 'url' : c.t === 'email' ? 'email' : c.t === 'num' ? 'number' : 'text';
      const dis = c.soloAlta && ED && ED.original ? ' disabled' : '';
      return '<div class="campo">' + lab + '<input id="' + id + '" type="' + tipo + '" data-k="' + c.k + '" value="' + esc(v == null ? '' : v) + '"' + req + dis + (tipo === 'number' ? ' min="0" max="100" step="1"' : '') + '>' + ay + '</div>';
    }
  }
}
async function pintarFotos(box) {
  const refs = JSON.parse(box.dataset.v || '[]');
  const urls = await Promise.all(refs.map(r => D.fotoUrl(r).catch(() => '')));
  box.innerHTML = refs.map((r, i) => '<div class="f"><img src="' + esc(urls[i]) + '" alt="Foto ' + (i + 1) + '"><div class="ops">' +
    (i > 0 ? '<button type="button" data-portada="' + i + '" title="Usar como portada">★</button>' : '<span></span>') +
    '<button type="button" data-quitar="' + i + '">Quitar</button></div></div>').join('') || '<span class="ayuda">Sin fotos</span>';
}
function objHtml(c, o, idx) {
  return '<div class="sub" data-obj="' + c.k + '"><div class="sub-h"><b>' + esc(c.item) + ' ' + (idx + 1) + '</b><span><button type="button" class="mini" data-objup>↑</button> <button type="button" class="mini rojo" data-objdel>Quitar</button></span></div><div class="grid2">' +
    c.campos.map(sc => sc.t === 'area' || sc.t === 'fotos' ? '' : campoHtml(sc, valorInicial(sc, o), 'o' + Math.random().toString(36).slice(2, 7) + '_')).join('') + '</div>' +
    c.campos.filter(sc => sc.t === 'area' || sc.t === 'fotos').map(sc => campoHtml(sc, valorInicial(sc, o), 'o' + Math.random().toString(36).slice(2, 7) + '_')).join('') + '</div>';
}
async function editar(t, x) {
  const S = SEC[t];
  ED = { t, S, original: x ? JSON.parse(JSON.stringify(x)) : null, nuevas: [] };
  $('edTitulo').textContent = (x ? 'Editar: ' : 'Nuevo: ') + S.titulo.toLowerCase();
  $('edMsg').textContent = '';
  $('edCuerpo').innerHTML = S.campos.map(c => campoHtml(c, valorInicial(c, x), 'c_')).join('');
  for (const c of S.campos.filter(c => c.t === 'objetos')) {
    const box = $('edCuerpo').querySelector('[data-objs="' + c.k + '"]');
    box.innerHTML = ((x && x[c.k]) || []).map((o, i) => objHtml(c, o, i)).join('');
  }
  await Promise.all([...$('edCuerpo').querySelectorAll('[data-fotos]')].map(pintarFotos));
  $('ed').showModal();
  const f = $('edCuerpo').querySelector('input:not([disabled]),textarea'); if (f) f.focus();
}
function cerrarEd() { $('ed').close(); }
$('edCerrar').onclick = cerrarEd; $('edCancelar').onclick = cerrarEd;
$('edCuerpo').addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.addobj) {
    const c = ED.S.campos.find(c => c.k === t.dataset.addobj), box = $('edCuerpo').querySelector('[data-objs="' + c.k + '"]');
    box.insertAdjacentHTML('beforeend', objHtml(c, null, box.children.length));
    box.lastElementChild.querySelectorAll('[data-fotos]').forEach(pintarFotos);
    const f = box.lastElementChild.querySelector('input,select'); if (f) f.focus();
  }
  if (t.hasAttribute('data-objdel')) t.closest('.sub').remove();
  if (t.hasAttribute('data-objup')) { const s = t.closest('.sub'); if (s.previousElementSibling) s.parentNode.insertBefore(s, s.previousElementSibling); }
  if (t.dataset.quitar !== undefined || t.dataset.portada !== undefined) {
    const box = t.closest('[data-fotos]'), v = JSON.parse(box.dataset.v);
    if (t.dataset.quitar !== undefined) v.splice(+t.dataset.quitar, 1);
    else { const [f] = v.splice(+t.dataset.portada, 1); v.unshift(f); }
    box.dataset.v = JSON.stringify(v); pintarFotos(box);
  }
});
$('edCuerpo').addEventListener('change', async e => {
  const inp = e.target; if (!inp.dataset.subir) return;
  const box = inp.closest('.campo').querySelector('[data-fotos]'), priv = box.dataset.priv === '1';
  const files = [...inp.files]; inp.value = ''; if (!files.length) return;
  $('edMsg').textContent = 'Subiendo ' + files.length + ' foto(s)…'; $('edGuardar').disabled = true;
  try {
    const clientes = priv ? lineas(($('edCuerpo').querySelector('[data-k="clientes"]') || {}).value).map(s => s.toLowerCase()) : null;
    for (const f of files) {
      const data = await D.achicarImagen(f);
      const ref = await D.subirFoto(data, priv, clientes);
      ED.nuevas.push(ref);
      const v = box.dataset.uno === '1' ? [ref] : JSON.parse(box.dataset.v).concat(ref);
      box.dataset.v = JSON.stringify(v);
    }
    await pintarFotos(box); $('edMsg').textContent = 'Fotos listas. Tocá Guardar.';
  } catch (er) { $('edMsg').textContent = ''; toast(D.mensajeError(er), true); }
  finally { $('edGuardar').disabled = false; }
});
const lineas = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
function leerCampos(campos, raiz) {
  const out = {}, errores = [];
  const esSub = raiz.classList && raiz.classList.contains('sub');
  const propio = n => (n.closest('.sub') || null) === (esSub ? raiz : null);
  for (const c of campos) {
    if (c.t === 'objetos') {
      out[c.k] = [...raiz.querySelectorAll(':scope [data-obj="' + c.k + '"]')].map(sub => { const r = leerCampos(c.campos, sub); errores.push(...r.errores.map(x => c.item + ': ' + x)); return r.out; });
      continue;
    }
    if (c.t === 'foto' || c.t === 'fotos') {
      const box = [...raiz.querySelectorAll('[data-fotos="' + c.k + '"]')].find(propio);
      const v = box ? JSON.parse(box.dataset.v || '[]') : []; out[c.k] = c.t === 'foto' ? (v[0] || '') : v; continue;
    }
    const el = [...raiz.querySelectorAll('[data-k="' + c.k + '"]')].find(propio);
    if (!el) continue;
    let v;
    if (c.t === 'check') v = el.checked;
    else if (c.t === 'lineas') v = lineas(el.value);
    else if (c.t === 'emails') v = lineas(el.value).map(s => s.toLowerCase());
    else if (c.t === 'parrafos') v = String(el.value).split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    else if (c.t === 'num') v = el.value === '' ? null : Math.max(0, Math.min(100, Number(el.value)));
    else v = String(el.value).trim();
    if (c.req && (v === '' || v == null || (Array.isArray(v) && !v.length))) errores.push('falta "' + c.l + '"');
    if (c.t === 'url' && v && !/^https?:\/\/|^\.\//.test(v)) errores.push('"' + c.l + '" tiene que empezar con https://');
    if ((c.t === 'email') && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) errores.push('el email no es válido');
    if (c.t === 'emails' && v.some(m => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m))) errores.push('hay un email no válido en "' + c.l + '"');
    if (v === null) continue;
    out[c.k] = v;
  }
  return { out, errores };
}
const fotosDe = (S, x) => {
  const r = [];
  const walk = (campos, o) => campos.forEach(c => {
    if (!o) return;
    if (c.t === 'foto' && o[c.k]) r.push(o[c.k]);
    if (c.t === 'fotos') r.push(...(o[c.k] || []));
    if (c.t === 'objetos') (o[c.k] || []).forEach(sub => walk(c.campos, sub));
  });
  walk(S.campos, x); return r.filter(f => /^fotop?:/.test(f));
};
async function borrarFotos(refs) {
  for (const r of refs) { const m = r.match(/^(foto|fotop):(.+)$/); if (m) await D.borrar(m[1] === 'foto' ? 'fotos' : 'fotosPrivadas', m[2]).catch(() => { }); }
}
$('edForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { t, S, original } = ED;
  const { out, errores } = leerCampos(S.campos, $('edCuerpo'));
  if (errores.length) { $('edMsg').textContent = 'Revisá: ' + errores.join(', '); return; }
  const item = Object.assign({}, original || {}, out);
  if (!original) {
    if (S.idDesde === 'email') {
      item.id = out.email.toLowerCase(); item.email = item.id;
      if (itemsDe(t).some(u => u.id === item.id)) { $('edMsg').textContent = 'Ese email ya está cargado.'; return; }
    } else item.id = D.nuevoId(out.titulo || out.nombre || t);
    const ords = itemsDe(t).map((x, k) => typeof x.orden === 'number' ? x.orden : k);
    item.orden = S.nuevoArriba ? (ords.length ? Math.min(...ords) - 1 : 0) : (ords.length ? Math.max(...ords) + 1 : 0);
  }
  $('edGuardar').disabled = true; $('edMsg').textContent = 'Guardando…';
  try {
    await D.guardar(S.col, item);
    if (t === 'clientes') { // las fotos privadas deben conocer a los clientes con acceso
      for (const r of fotosDe(S, item)) { const id = r.slice(6); const f = await D.obtener('fotosPrivadas', id).catch(() => null); if (f) { f.clientes = item.clientes; await D.guardar('fotosPrivadas', f); } }
    }
    const quedan = new Set(fotosDe(S, item));
    await borrarFotos([...fotosDe(S, original), ...ED.nuevas].filter(r => !quedan.has(r)));
    ED.nuevas = [];
    cerrarEd(); toast('Guardado'); abrirTab(TAB);
  } catch (er) { $('edMsg').textContent = D.mensajeError(er); }
  finally { $('edGuardar').disabled = false; }
});
$('ed').addEventListener('close', () => { if (ED && ED.nuevas.length) { borrarFotos(ED.nuevas); ED.nuevas = []; } });

/* ================= Ajustes ================= */
async function pintarAjustes() {
  const a = (await D.obtener('ajustes', 'general').catch(() => null)) || {};
  $('hoja').innerHTML = '<div class="hoja-h"><div><h2 style="font-size:1.5rem">Ajustes</h2><p>Datos generales que usa la web.</p></div></div>' +
    '<form id="fAj" style="display:grid;gap:14px;max-width:620px">' +
    '<div class="campo"><label for="ajWa">WhatsApp para consultas de propiedades</label><input id="ajWa" value="' + esc(a.whatsappInmobiliaria || '') + '" inputmode="tel"><div class="ayuda">Con código de país, sin + ni espacios. Ej.: 595986573190</div></div>' +
    '<div class="campo"><label for="ajAv">Aviso al pie de la revista de precios</label><textarea id="ajAv">' + esc(a.avisoPrecios || '') + '</textarea></div>' +
    '<button class="btn red" style="width:max-content">Guardar ajustes</button></form>' +
    (D.modo === 'demo' ? '<div style="margin-top:28px"><button type="button" class="mini rojo" id="demoReset">Borrar los datos de la demostración</button></div>' : '');
  $('fAj').onsubmit = async e => {
    e.preventDefault();
    try { await D.guardar('ajustes', Object.assign({}, a, { id: 'general', whatsappInmobiliaria: $('ajWa').value.replace(/\D/g, ''), avisoPrecios: $('ajAv').value.trim() })); toast('Ajustes guardados'); }
    catch (er) { toast(D.mensajeError(er), true); }
  };
  if ($('demoReset')) $('demoReset').onclick = () => { D.demoReiniciar(); toast('Demostración reiniciada'); setTimeout(() => location.reload(), 600); };
}

/* ================= Importar contenido actual (una sola vez) ================= */
async function importar(b) {
  b.disabled = true; b.textContent = 'Importando…';
  try {
    const j = await D.contenidoInicial();
    let n = 0;
    for (const col of ['noticias', 'obras', 'ediciones', 'fuentes', 'propiedades', 'ajustes']) {
      for (const it of j[col] || []) { await D.guardar(col, it); n++; }
    }
    toast('Listo: ' + n + ' elementos importados'); abrirTab(TAB);
  } catch (er) { toast(D.mensajeError(er), true); b.disabled = false; b.textContent = 'Reintentar importación'; }
}

/* ================= Sesión ================= */
if (D.modo === 'demo') {
  const d = document.createElement('div'); d.className = 'demo-banda'; d.textContent = 'Modo demostración: los cambios se guardan solo en este navegador.'; document.body.prepend(d);
}
$('btnSalir').onclick = async () => { await D.salir(); location.href = './cliente.html' + (D.modo === 'demo' ? '?demo' : ''); };
function sinAcceso(html) { $('app').hidden = true; const s = $('sinAcceso'); s.hidden = false; s.innerHTML = html; }
D.alCambiarSesion(s => {
  const ir = './cliente.html' + (D.modo === 'demo' ? '?demo' : '');
  if (D.modo === 'json') return sinAcceso('<h2>Panel todavía sin conectar</h2><p style="margin-top:10px;color:var(--muted)">Falta configurar Firebase (ver LEEME.txt, paso a paso). Mientras tanto podés recorrer el panel en <a href="./admin.html?demo">modo demostración</a>.</p>');
  if (s.motivo !== 'ok') return sinAcceso('<h2>Ingresá para usar el panel</h2><p style="margin:10px 0 16px;color:var(--muted)">' + (s.motivo === 'no-autorizado' ? 'Tu email no está autorizado.' : 'Ingresá con tu cuenta autorizada.') + '</p><a class="btn red" href="' + ir + '">Ingresar</a>');
  PERFIL = s.perfil;
  const permisos = D.PERMISOS[PERFIL.rol] || [];
  if (!permisos.length) { location.href = ir; return; }
  $('who').innerHTML = '<b>' + esc(PERFIL.nombre && PERFIL.nombre !== 'Demo' ? PERFIL.nombre : PERFIL.email) + '</b><br>' + esc(D.ROLES[PERFIL.rol] || PERFIL.rol);
  $('btnSalir').hidden = false;
  const tabs = TABS.filter(([k]) => permisos.includes(k));
  $('tabs').innerHTML = tabs.map(([k, l]) => '<button type="button" role="tab" data-t="' + k + '">' + l + '</button>').join('') + '<a class="mini" style="display:inline-flex;align-items:center;text-decoration:none;margin-left:auto" href="./cliente.html' + (D.modo === 'demo' ? '?demo' : '') + '">Vista del cliente</a>';
  $('tabs').onclick = e => { const b = e.target.closest('button[data-t]'); if (b) abrirTab(b.dataset.t); };
  $('sinAcceso').hidden = true; $('app').hidden = false;
  let guardada = null; try { guardada = localStorage.getItem('ciprodec-admin-tab'); } catch (e) { }
  abrirTab(tabs.some(([k]) => k === guardada) ? guardada : tabs[0][0]);
});
</script>
